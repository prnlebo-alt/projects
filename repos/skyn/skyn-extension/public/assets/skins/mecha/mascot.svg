<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#7ee787" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
  <!-- antenna -->
  <line x1="24" y1="3" x2="24" y2="9"/>
  <circle cx="24" cy="3" r="1.2" fill="#7ee787" stroke="none"/>
  <!-- helmet outer -->
  <rect x="8" y="11" width="32" height="30" rx="2"/>
  <!-- visor recess -->
  <rect x="12" y="17" width="24" height="9" fill="#7ee787" fill-opacity="0.12" stroke-width="1"/>
  <!-- LED eyes -->
  <rect x="15" y="20" width="4" height="3" fill="#7ee787" stroke="none"/>
  <rect x="29" y="20" width="4" height="3" fill="#7ee787" stroke="none"/>
  <!-- mouth grille -->
  <line x1="15" y1="32" x2="33" y2="32"/>
  <line x1="15" y1="35" x2="33" y2="35"/>
  <line x1="15" y1="38" x2="33" y2="38"/>
  <!-- side vents -->
  <line x1="8" y1="22" x2="5" y2="22"/>
  <line x1="8" y1="26" x2="5" y2="26"/>
  <line x1="40" y1="22" x2="43" y2="22"/>
  <line x1="40" y1="26" x2="43" y2="26"/>
</svg>

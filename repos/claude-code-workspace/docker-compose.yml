version: "3.8"

# Local development/test Postgres for the Market Intelligence Phase 1 evidence
# engine. Not used in production; Phase 1 tests require a reachable
# PostgreSQL instance at DATABASE_URL (see .env.example).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_intelligence
    ports:
      - "5432:5432"
    volumes:
      - mi_postgres_data:/var/lib/postgresql/data

volumes:
  mi_postgres_data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20103a">
<meta name="color-scheme" content="dark">
<title>Sling Trash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20103a; --cream:#fff3d6; --orange:#ff8a1f; --yellow:#ffd23f; --panel:#3a2368;
    --font-display:"Lilita One","Arial Black",Impact,sans-serif;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 20% 20%,#3a2368 0,transparent 45%),radial-gradient(circle at 80% 80%,#3a2368 0,transparent 45%),var(--ink);color:var(--cream);overflow-x:clip;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #tip{display:none;text-align:center;padding:0 16px 16px;font-size:18px;color:var(--yellow)}
  @media (orientation:portrait) and (max-width:600px){#tip{display:block}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  body{display:flex;flex-direction:column;touch-action:manipulation;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none;font-family:var(--font-display)}
  nav{display:flex;gap:8px;padding:8px 16px;justify-content:center;flex:none}
  nav button{min-height:40px;min-width:40px;background:var(--panel);color:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font:inherit;font-size:16px;box-shadow:0 3px 0 #000;cursor:pointer;white-space:nowrap}
  nav button:hover{filter:brightness(1.12)}
  nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
  nav button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  nav button.pri{background:var(--orange);color:var(--ink)}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px 12px}
  canvas{border-radius:16px;border:4px solid var(--ink);box-shadow:0 6px 0 #000;touch-action:none;max-width:100%}
</style>
</head>
<body>
<nav>
  <button id="map" aria-label="Level map">Map</button>
  <button id="restart" class="pri">Restart</button>
  <button id="snd" aria-pressed="false" aria-label="Toggle sound">Sound: on</button>
</nav>
<div id="stage"><canvas id="c" width="800" height="450" role="img" aria-label="Sling Trash game board. Pull back on the trash bag and release to throw it into the dumpsters."></canvas></div>
<div id="tip">Tip: turn your phone sideways for a bigger board.</div>
<div class="sr" id="sr" aria-live="polite"></div>
<script src="assets/meta.js"></script>
<script src="art/meta.js"></script>
<script src="art/world_meta.js"></script>
<script>
'use strict';
const W = 800, H = 450, GROUND = 380;
const INK = '#20103a';
const P = {cream: '#fff3d6', orange: '#ff8a1f', yellow: '#ffd23f', green: '#3fbf6a', darkgreen: '#2a8f50', teal: '#2fb7c9',
           purple: '#6a3fb5', pink: '#ff6fa5', red: '#e8453c', white: '#fff', brown: '#a9703c', skin: '#f2b98a', navy: '#2b4a8f'};
const FONT = '"Lilita One","Arial Black",Impact,sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1;
const V = (x, y) => ({x, y});
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ------------------------------ drawing kit ------------------------------ */
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fs(fill, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw !== 0) { ctx.lineWidth = lw || 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
const circle = (x, y, r, fill, lw) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); fs(fill, lw); };
const box = (x, y, w, h, r, fill, lw, shade) => {
  ctx.beginPath(); rrect(x, y, w, h, r); fs(fill, lw);
  if (shade !== false && typeof fill === 'string' && fill[0] === '#' && w >= 36 && h >= 30) {
    ctx.save(); ctx.beginPath(); rrect(x, y, w, h, r); ctx.clip();
    if (shade !== 'hl') { ctx.fillStyle = 'rgba(0,0,0,.13)'; ctx.fillRect(x, y + h * .72, w, h); }
    ctx.fillStyle = 'rgba(255,255,255,.26)'; ctx.fillRect(x + 4, y + 4, Math.min(8, w * .14), h - 14);
    ctx.restore(); ctx.beginPath(); rrect(x, y, w, h, r); ctx.lineWidth = lw || 3; ctx.strokeStyle = INK; ctx.stroke();
  }
};
const poly = (pts, fill, lw) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); fs(fill, lw); };
function line(x1, y1, x2, y2, col, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = lw + 4; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
}
function ctext(s, x, y, size, fill, align, lw) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw === undefined ? Math.max(3, size * .2) : lw; ctx.strokeStyle = INK;
  if (ctx.lineWidth > 0) ctx.strokeText(s, x, y); ctx.fillStyle = fill || P.cream; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function bubble(x, y, w, text, size, tx, ty, shown) {
  const lines = wrap(text, w - 28, size), h = lines.length * (size + 4) + 24;
  ctx.beginPath(); rrect(x, y, w, h, 16);
  const cx = clamp(tx, x + 24, x + w - 24);
  ctx.moveTo(cx - 8, y + h - 1); ctx.lineTo(tx, ty); ctx.lineTo(cx + 8, y + h - 1);
  fs(P.white, 4);
  ctx.beginPath(); ctx.moveTo(cx - 6, y + h - 2); ctx.lineTo(cx + 6, y + h - 2); ctx.strokeStyle = P.white; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.font = `${size}px ${FONT}`;
  let cnt = 0;
  lines.forEach((l, i) => { const part = shown == null ? l : l.slice(0, Math.max(0, shown - cnt)); cnt += l.length + 1; ctx.fillText(part, x + 14, y + 12 + size + i * (size + 4) - 2); });
  return h;
}
function eye(x, y, r, tx, ty, closed) {
  if (closed) { ctx.beginPath(); ctx.arc(x, y + r * .3, r * .8, Math.PI * 1.1, Math.PI * 1.9); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke(); return; }
  circle(x, y, r, P.white, 2.5);
  const a = Math.atan2(ty - y, tx - x), d = r * .38;
  circle(x + Math.cos(a) * d, y + Math.sin(a) * d, r * .5, INK, 0);
}
/* drawBottle/drawSpark: placeholder canvas shapes for new mechanics elements
 * (glass-bottle trash, tap-ability hit sparks). Restyle freely; callers only
 * depend on the (x, y, rot, scale) signature. */
function drawBottle(x, y, rot, scale) {
  const k = scale || 1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(k, k);
  box(-7, -9, 14, 26, 4, '#bfe9f5', 3, false);
  box(-3.5, -20, 7, 12, 2, '#bfe9f5', 3, false);
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(-4, -6, 2.5, 18);
  eye(-3, 2, 3, 3, 0, false); eye(3, 2, 3, 3, 0, false);
  ctx.restore();
}
function drawSpark(x, y, t, col) {
  const k = 1 - clamp(t, 0, 1), r = 6 + k * 26;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = clamp(t, 0, 1);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283, rr = i % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); fs(col || P.yellow, 2.5);
  ctx.restore();
}

/* --------------------------------- Pull ---------------------------------- *
 * Reusable pull-to-launch input. Values below are our own, tuned by feel and
 * playtest against the 15 levels (see LEGAL_NOTES.md for what changed and
 * why). Over-stretch past maxPull is visual only.                          */
class Pull {
  constructor() {
    Object.assign(this, {maxPull: 130, minPull: 30, grab: 70, ratio: 1.15, soft: .22, aimMin: .28, dots: 14, dotStep: .05, curve: .72});
    this.anchor = V(0, 0); this.handle = V(0, 0); this.vel = V(0, 0); this.active = false; this.enabled = true;
  }
  setAnchor(x, y) { this.anchor = V(x, y); this.handle = V(x, y); this.vel = V(0, 0); this.active = false; }
  down(p) {
    if (!this.enabled || Math.hypot(p.x - this.anchor.x, p.y - this.anchor.y) > this.grab) return false;
    this.active = true; this.move(p); return true;
  }
  move(p) {
    if (!this.active) return;
    let dx = (p.x - this.anchor.x) * this.ratio, dy = (p.y - this.anchor.y) * this.ratio;
    const d = Math.hypot(dx, dy);
    if (d > this.maxPull) { const e = this.maxPull + this.maxPull * this.soft * Math.tanh((d - this.maxPull) / this.maxPull); dx *= e / d; dy *= e / d; }
    this.handle = V(this.anchor.x + dx, this.anchor.y + dy);
  }
  read() {
    const vx = this.anchor.x - this.handle.x, vy = this.anchor.y - this.handle.y;
    const d = Math.hypot(vx, vy), pull = Math.min(d, this.maxPull), t = pull / this.maxPull;
    return {vx, vy, pull, t, power: Math.pow(t, this.curve), angle: Math.atan2(vy, vx), dir: d ? V(vx / d, vy / d) : V(0, 0)};
  }
  up() {
    if (!this.active) return null;
    this.active = false; this.vel = V(0, 0);
    const r = this.read();
    return r.pull >= this.minPull ? r : Object.assign(r, {cancelled: true});
  }
  tick(dt) {
    if (this.active) return;
    for (const a of ['x', 'y']) { this.vel[a] += (-900 * (this.handle[a] - this.anchor[a]) - 28 * this.vel[a]) * dt; this.handle[a] += this.vel[a] * dt; }
  }
}
const pull = new Pull();

/* -------------------------------- sprites --------------------------------- *
 * Pre-rendered toon sprites from Blender (headless, scripts in the build notes).
 * Each draws only when loaded; the canvas drawing remains as a fallback.        */
const SPR = {};
if (window.WORLD_META) { window.SPRITE_META = window.SPRITE_META || {}; Object.keys(WORLD_META).forEach(n => { SPRITE_META[n] = WORLD_META[n]; }); }   // illustrated world art overrides the Blender renders
(window.SPRITE_META ? Object.keys(SPRITE_META) : []).forEach(n => {
  const svg = !!SPRITE_META[n].svg, path = (svg ? 'art/' : 'assets/') + n + (svg ? '.svg' : '.png'), im = new Image();
  im.onerror = () => { if (!im.dataset.retry) { im.dataset.retry = '1'; setTimeout(() => { im.src = path + '?retry=1'; }, 400); } };
  im.onload = () => cacheTo(SPRC, n, im); im.src = path; SPR[n] = im;
});
const sok = n => !!(window.SPRITE_META && SPRITE_META[n] && SPR[n] && SPR[n].complete && SPR[n].naturalWidth > 0);
function sprBody(n, bx, by, bw, bh) {
  const m = SPRITE_META[n], b = m.body, sx = bw / (b[2] - b[0]), sy = bh / (b[3] - b[1]);
  ctx.drawImage(SPRC[n] || SPR[n], bx - b[0] * sx, by - b[1] * sy, m.w * sx, m.h * sy);
}
function sprUnit(n, x, y, kpx, anchor) {
  const m = SPRITE_META[n], bb = m.bbox, k = m.svg ? kpx * (m.hu || 2.3) / (bb[3] - bb[1]) : kpx / (m.w / m.ortho), cx = (bb[0] + bb[2]) / 2;
  const oy = anchor === 'bottom' ? y - bb[3] * k : y - (bb[1] + bb[3]) / 2 * k;
  ctx.drawImage(SPRC[n] || SPR[n], x - cx * k, oy, m.w * k, m.h * k);
}

/* ---------------------------- 2D illustrated art ---------------------------- *
 * Hand-built SVG illustrations (tools/svg/make_art.py), styled after reference/target-keyart.webp.
 * They take priority over the Blender sprites when loaded.                                       */
const ART = {}, ARTC = {}, SPRC = {};
function cacheTo(map, n, im) { try { const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); map[n] = c; } catch (e) {} }
(window.ART_META ? Object.keys(ART_META) : []).forEach(n => { const im = new Image(); im.onerror = () => { if (!im.dataset.retry) { im.dataset.retry = '1'; setTimeout(() => { im.src = 'art/' + n + '.svg?retry=1'; }, 400); } }; im.onload = () => cacheTo(ARTC, n, im); im.src = 'art/' + n + '.svg'; ART[n] = im; });
const aok = n => !!(window.ART_META && ART_META[n] && ART[n] && ART[n].complete && ART[n].naturalWidth > 0);
function artBody(n, bx, by, bw, bh) {
  const m = ART_META[n], b = m.body, sx = bw / (b[2] - b[0]), sy = bh / (b[3] - b[1]);
  ctx.drawImage(ARTC[n] || ART[n], bx - b[0] * sx, by - b[1] * sy, m.w * sx, m.h * sy);
}
function artAt(n, x, y, k) { const m = ART_META[n], a = m.anchor || [m.w / 2, m.h]; ctx.drawImage(ARTC[n] || ART[n], x - a[0] * k, y - a[1] * k, m.w * k, m.h * k); }

/* --------------------------------- audio --------------------------------- */
let AC = null, master = null, musicTimer = 0, step = 0, muted = false;
const note = n => 55 * Math.pow(2, n / 12);
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : .5; master.connect(AC.destination);
    musicTimer = setInterval(musicStep, 240);
  } catch (e) { AC = null; }
}
function tone(f, t0, dur, type, vol, slide) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(t0, dur, vol) {
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(master); s.start(t0);
}
function sfx(n, arg) {
  if (!AC || muted) return; const t = AC.currentTime;
  switch (n) {
    case 'launch': noise(t, .12, .25); tone(500, t, .18, 'triangle', .25, .4); break;
    case 'thump': tone(130, t, .12, 'sine', .35, .5); break;
    case 'ping': tone(1100, t, .1, 'triangle', .2, .8); break;
    case 'boing': tone(260, t, .25, 'sine', .3, 2.2); break;
    case 'clang': tone(330, t, .25, 'square', .12); tone(497, t, .25, 'square', .1); break;
    case 'score': [0, 4, 7, 12].forEach((k, i) => tone(note(24 + k), t + i * .07, .16, 'square', .14)); break;
    case 'hit': tone(80, t, .3, 'sawtooth', .3, .5); noise(t, .15, .2); break;
    case 'lid': tone(180, t, .08, 'square', .12, .6); break;
    case 'lose': [0, -2, -4, -7].forEach((k, i) => tone(note(24 + k), t + i * .18, .3, 'sawtooth', .12)); break;
    case 'win': [0, 4, 7, 12, 7, 12, 16].forEach((k, i) => tone(note(24 + k), t + i * .1, .2, 'square', .14)); break;
    case 'click': tone(700, t, .05, 'square', .1); break;
    case 'pop': tone(400 + (arg || 0) * 80, t, .08, 'triangle', .15, 1.6); break;
    case 'shatter': noise(t, .18, .3); tone(1400, t, .12, 'sawtooth', .18, .3); tone(900, t + .03, .1, 'square', .12, .4); break;
    case 'dash': tone(700, t, .1, 'sawtooth', .18, 1.8); break;
    case 'slam': tone(90, t, .16, 'square', .3, .4); break;
  }
}
const BASS = [0, 0, 7, 7, 5, 5, 7, 3], LEAD = [24, 28, 31, 28, 29, 33, 31, 27, 24, 28, 31, 36, 34, 31, 29, 27];
function musicStep() {
  if (!AC || muted || document.hidden) return;
  const t = AC.currentTime, root = [0, 2, -2, 5, -4][curWorld()] || 0, i = step++;
  tone(note(root + BASS[(i >> 1) % 8]), t, .22, 'triangle', .13);
  if (i % 2 === 0) tone(note(root + LEAD[(i >> 1) % 16]), t, .2, 'square', .045);
  if (i % 4 === 2) noise(t, .04, .05);
}
const setMuted = m => { muted = m; try { localStorage.setItem('slingtrash.mute', m ? '1' : '0'); } catch (e) {} if (master) master.gain.value = m ? 0 : .5; document.getElementById('snd').textContent = 'Sound: ' + (m ? 'off' : 'on'); document.getElementById('snd').setAttribute('aria-pressed', String(m)); };

/* ---------------------------------- data --------------------------------- */
const TYPES = {bag: {r: 14, e: .35, mult: 1}, can: {r: 9, e: .55, mult: 1.12}, tire: {r: 16, e: .22, mult: .85}, bottle: {r: 10, e: .4, mult: 1.05}};
const ORDER = ['bag', 'can', 'bag', 'tire', 'bag', 'can'];
/* Tap abilities, keyed by trash type: mid-flight pointerdown on the ball
 * triggers these (see tapAbility()). Each level's `queue` (added below)
 * declares the order bags come out of the pouch; ORDER is the pre-queue
 * fallback kept only so an older/odd level without `queue` still cycles. */
const ABILITY = {bag: 'split', can: 'dash', tire: 'slam', bottle: 'shatter'};
const VMAX = 760, G = 700;
const LID = (on, off, ph) => ({on, off, ph: ph || 0});

/* ---------------------------- destructible blocks -------------------------- *
 * Simple AABB blocks (no rotation): gravity + ground/block/ball collision at
 * the game's fixed step. Damage is by impact speed; 'crate' is a rotten-crate
 * TNT block that chain-explodes on break. drawBlock(b) is the single draw
 * entry point; restyled visuals plug in there without touching this physics. */
const BLOCK_MATS = {
  wood: {hp: 2, breakSpeed: 240, color: '#c9924a', crack: '#8b5a2b'},
  glass: {hp: 1, breakSpeed: 110, color: '#bfe9f5', crack: '#5f98aa'},
  stone: {hp: 3, breakSpeed: 420, color: '#9a978f', crack: '#5c5a54'},
  crate: {hp: 1, breakSpeed: 90, color: '#b5542f', crack: '#7a2f18', tnt: true}
};
const tower = (x, mats, w) => mats.map((mat, i) => ({x, y: GROUND - (i + 1) * (w || 34), w: w || 34, h: w || 34, mat}));
const bridge = (x, span, mat) => { const leg = 30, plankH = 18, plankW = span - 2 * leg;
  return [{x, y: GROUND - leg, w: leg, h: leg, mat: 'stone'}, {x: x + span - leg, y: GROUND - leg, w: leg, h: leg, mat: 'stone'},
          {x: x + leg, y: GROUND - leg - plankH, w: plankW, h: plankH, mat: mat || 'wood'}]; };

const WORLDS = [
  {name: 'Maple Drive', sub: 'Bins Gone Missing', card: '#8fdc8f'},
  {name: 'Skyscraper Row', sub: 'Corporate Waste', card: '#ffb27a'},
  {name: 'Stinky Wharf', sub: 'Fishy Business', card: '#7fdde0'},
  {name: 'Lucky Dumpster Casino', sub: 'All In', card: '#b98ae6'},
  {name: 'Mount Rubbish', sub: 'Landfill Rising', card: '#c9dc66'}
];
const LEVELS = [
  {w: 0, bags: 4, par: 2, hint: 'Pull the bag back, then let go!', dump: [{x: 560, w: 92, h: 55}], obs: [], queue: ['bag', 'bag', 'can', 'tire']},
  {w: 0, bags: 4, par: 2, hint: 'Cars are bouncy. Use that.', dump: [{x: 650, w: 92, h: 55}], obs: [{k: 'car', x: 380, w: 140, h: 48}], queue: ['bag', 'can', 'bag', 'tire']},
  {w: 0, bags: 4, par: 3, hint: 'Lob it high over the fence.', dump: [{x: 700, w: 88, h: 55}], obs: [{k: 'fence', x: 450, w: 16, h: 150}], queue: ['bag', 'tire', 'can', 'bag', 'tire']},
